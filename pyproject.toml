[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-code-review-casebook"
version = "0.1.1"
description = "Grade AI-written fixes against real bug cases: example tests, property tests and mutation checks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
casebook = "casebook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/casebook"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
