[project]
name = "ai-code-review-casebook"
version = "0.1.0"
description = "Real bugs that AI coding agents shipped, each with a failing test, a fix and a written evaluation."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["cases", "test_buggy_versions_fail.py"]
addopts = "--import-mode=importlib"
